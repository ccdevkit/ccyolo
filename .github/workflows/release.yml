name: Release

on:
  push:
    branches: ['release/*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ccdevkit/ccyolo-base

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Extract version from branch name (release/0.1.0 -> 0.1.0)
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Extract version from branch
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

  build-docker:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Native builds with CGO enabled (clipboard support)
  build-binaries-native:
    needs: version
    strategy:
      matrix:
        include:
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            goos: darwin
            goarch: arm64
          # macOS AMD64 (Intel)
          - os: macos-15-intel
            goos: darwin
            goarch: amd64
          # Linux AMD64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          # Windows AMD64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 dev headers (Linux)
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary (Unix)
        if: matrix.goos != 'windows'
        env:
          CGO_ENABLED: 1
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o ccyolo ./cmd/ccyolo
          tar -czvf ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ccyolo

      - name: Build binary (Windows)
        if: matrix.goos == 'windows'
        env:
          CGO_ENABLED: 1
        run: |
          $VERSION = "${{ needs.version.outputs.version }}"
          go build -ldflags="-s -w -X main.Version=$VERSION" -o ccyolo.exe ./cmd/ccyolo
          tar -czvf ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz ccyolo.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  # Cross-compiled builds without CGO (no clipboard, ARM64 platforms)
  build-binaries-cross:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux ARM64 (no native runner available)
          - goos: linux
            goarch: arm64
          # Windows ARM64 (no native runner available)
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          BINARY_NAME="ccyolo"
          if [ "$GOOS" = "windows" ]; then
            BINARY_NAME="ccyolo.exe"
          fi
          go build -ldflags="-s -w -X main.Version=${VERSION}" -o "$BINARY_NAME" ./cmd/ccyolo
          tar -czvf ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz "$BINARY_NAME"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ccyolo-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  create-release:
    needs: [version, build-binaries-native, build-binaries-cross, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.version }}
          files: artifacts/**/*.tar.gz
          generate_release_notes: true

  publish-npm:
    needs: [version, create-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Prepare npm package
        run: |
          cp README.md npm/
          cd npm
          npm version ${{ needs.version.outputs.version }} --no-git-tag-version

      # Uses OIDC trusted publishing - no NPM_TOKEN needed
      # Configure at: https://www.npmjs.com/package/@cckit/ccyolo/access
      - name: Publish to npm
        working-directory: npm
        run: npm publish --provenance --access public
